services:
  - type: web
    name: maxiconecta-frontend
    runtime: static
    repo: https://github.com/OsquiMenacho28/Group-E_Marketplace-and-Sales_Frontend
    branch: Alex
    autoDeployTrigger: 'off'
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_GATEWAY_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  - type: web
    name: maxiconecta-gateway
    runtime: docker
    branch: Alex
    region: oregon
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    dockerfilePath: gateway/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - fromGroup: maxiconecta-runtime
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        sync: false
      - key: MS_CATALOGO_HOSTPORT
        fromService:
          type: pserv
          name: maxiconecta-catalogo
          property: hostport
      - key: MS_CLIENTES_HOSTPORT
        fromService:
          type: pserv
          name: maxiconecta-clientes
          property: hostport
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maxiconecta-redis
          property: connectionString

  - type: pserv
    name: maxiconecta-catalogo
    runtime: docker
    branch: Alex
    region: oregon
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    dockerfilePath: services/catalogo/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: maxiconecta-runtime
      - key: SUPABASE_URL
        fromService:
          type: pserv
          name: maxiconecta-clientes
          envVarKey: SUPABASE_URL
      - key: SUPABASE_KEY
        fromService:
          type: pserv
          name: maxiconecta-clientes
          envVarKey: SUPABASE_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService:
          type: pserv
          name: maxiconecta-clientes
          envVarKey: SUPABASE_SERVICE_ROLE_KEY
      - key: PORT
        value: "8001"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maxiconecta-redis
          property: connectionString

  - type: pserv
    name: maxiconecta-clientes
    runtime: docker
    branch: Alex
    region: oregon
    plan: 0.5c-512mb
    autoDeployTrigger: 'off'
    dockerfilePath: services/clientes/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: maxiconecta-runtime
      - key: PORT
        value: "8004"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: maxiconecta-redis
          property: connectionString

  - type: keyvalue
    name: maxiconecta-redis
    region: oregon
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction

envVarGroups:
  - name: maxiconecta-runtime
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true